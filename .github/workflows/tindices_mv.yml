name: Update MV Tile Indices

on:
  workflow_call:
    outputs:
      artifact_name:
        description: "MV Tile Indices"
        value: ${{ jobs.build.outputs.artifact_name }}

permissions:
  contents: read

jobs:

  # DTM
  update-tindex-dtm-mv:
    uses: ./.github/workflows/tindex_creation.yml
    with:
      type: DTM
      state: MV
      script: MV_DTM_tindex.py
      tindex_file: mv_dtm_tindex_proj.gpkg.gz
      alpine_packages: "gzip"
  
  # iDSM
  update-tindex-idsm-mv:
    uses: ./.github/workflows/tindex_creation.yml
    with:
      type: iDSM
      state: MV
      script: MV_iDSM_tindex.py
      tindex_file: mv_idsm_tindex_proj.gpkg.gz
      alpine_packages: "gzip"
  
  # DOP
  update-tindex-dop-mv:
    uses: ./.github/workflows/tindex_creation.yml
    with:
      type: DOP
      state: MV
      script: MV_DOP_tindex.py
      tindex_file: mv_dop_tindex_proj.gpkg.gz
      alpine_packages: "gzip"
