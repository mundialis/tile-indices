name: Update HE Tile Indices

on:
  workflow_call:
    outputs:
      artifact_name:
        description: "HE Tile Indices"
        value: ${{ jobs.build.outputs.artifact_name }}

jobs:

  # DTM
  update-tindex-dtm-he:
    uses: ./.github/workflows/tindex_creation.yml
    with:
      type: DTM
      state: HE
      script: HE_DTM_tindex.py
      epsg_for_grass: 25832
      tindex_file: HE_DTM_tindex.gpkg.gz
      python_libs: "remotezip"

  # DSM
  update-tindex-dsm-he:
    uses: ./.github/workflows/tindex_creation.yml
    with:
      type: DSM
      state: HE
      script: HE_DSM_tindex.py
      epsg_for_grass: 25832
      tindex_file: HE_DSM_tindex.gpkg.gz
      python_libs: "remotezip"

