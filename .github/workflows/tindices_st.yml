name: Update ST Tile Indices

on:
  workflow_call:
    outputs:
      artifact_name:
        description: "ST Tile Indices"
        value: ${{ jobs.build.outputs.artifact_name }}

permissions:
  contents: read

jobs:

  # DTM (not needed)
  
  # DSM (not needed)
  
  # DOP
  update-tindex-dop-st:
    uses: ./.github/workflows/tindex_creation.yml
    with:
      type: DOP
      state: ST
      script: ST_DOP_tindex.py
      tindex_file: st_dop_tindex_proj.gpkg.gz
      python_libs: "requests"
      alpine_packages: "gzip"
