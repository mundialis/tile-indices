name: Update all Tile Indices

on:
  push:
    branches: [ main ]
  schedule:
    # run tile index creation every month
    - cron: '0 1 10 * *'

# the workflow does not require permissions, but to avoid a code security warning this should be explicitly defined:
permissions: {}

jobs:
  be-bb:
    if: ${{ github.repository == 'mundialis/tile-indices' }}
    permissions:
      contents: read
    uses: ./.github/workflows/tindices_be_bb.yml
  hb:
    if: ${{ github.repository == 'mundialis/tile-indices' }}
    permissions:
      contents: read
    uses: ./.github/workflows/tindices_hb.yml
  # TODO HE: tindex creation takes over 6 h so that the job is canceled
  # he:
  #   uses: ./.github/workflows/tindices_he.yml
  hh:
    if: ${{ github.repository == 'mundialis/tile-indices' }}
    permissions:
      contents: read
    uses: ./.github/workflows/tindices_hh.yml
  mv:
    if: ${{ github.repository == 'mundialis/tile-indices' }}
    permissions:
      contents: read
    uses: ./.github/workflows/tindices_mv.yml
  ni:
    if: ${{ github.repository == 'mundialis/tile-indices' }}
    permissions:
      contents: read
    uses: ./.github/workflows/tindices_ni.yml
  nw:
    if: ${{ github.repository == 'mundialis/tile-indices' }}
    permissions:
      contents: read
    uses: ./.github/workflows/tindices_nw.yml
  rp:
    if: ${{ github.repository == 'mundialis/tile-indices' }}
    permissions:
      contents: read
    uses: ./.github/workflows/tindices_rp.yml
  sh:
    if: ${{ github.repository == 'mundialis/tile-indices' }}
    permissions:
      contents: read
    uses: ./.github/workflows/tindices_sh.yml
  sn:
    if: ${{ github.repository == 'mundialis/tile-indices' }}
    permissions:
      contents: read
    uses: ./.github/workflows/tindices_sn.yml
  st:
    if: ${{ github.repository == 'mundialis/tile-indices' }}
    permissions:
      contents: read
    uses: ./.github/workflows/tindices_st.yml
  th:
    if: ${{ github.repository == 'mundialis/tile-indices' }}
    permissions:
      contents: read
    uses: ./.github/workflows/tindices_th.yml

  # commit all updated tile indices
  upload_tile_indices:
    needs: [be-bb,hb,hh,mv,ni,nw,rp,sh,sn,st,th]
    # upload if jobs successfull or fail
    # (update also if few federal states fail)
    if: ${{ github.repository == 'mundialis/tile-indices' && !cancelled() }}
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/update_tindices.yml
    with:
      commit_message: "Update tile indices"
