name: Update all Tile Indices

on:
  push:
    branches: [ main, workflows.update ]
  schedule:
    # run tile index creation every month
    - cron: '0 1 10 * *'

# the workflow does not require permissions, but to avoid a code security warning this should be explicitly defined:
permissions: {}

jobs:
  be-bb:
    permissions:
      contents: read
    uses: ./.github/workflows/tindices_be_bb.yml
  hb:
    permissions:
      contents: read
    uses: ./.github/workflows/tindices_hb.yml
  # TODO HE: tindex creation takes over 6 h so that the job is canceled
  # he:
  #   uses: ./.github/workflows/tindices_he.yml
  hh:
    permissions:
      contents: read
    uses: ./.github/workflows/tindices_hh.yml
  mv:
    permissions:
      contents: read
    uses: ./.github/workflows/tindices_mv.yml
  ni:
    permissions:
      contents: read
    uses: ./.github/workflows/tindices_ni.yml
  nw:
    permissions:
      contents: read
    uses: ./.github/workflows/tindices_nw.yml
  rp:
    permissions:
      contents: read
    uses: ./.github/workflows/tindices_rp.yml
  sh:
    permissions:
      contents: read
    uses: ./.github/workflows/tindices_sh.yml
  sn:
    permissions:
      contents: read
    uses: ./.github/workflows/tindices_sn.yml
  st:
    permissions:
      contents: read
    uses: ./.github/workflows/tindices_st.yml
  th:
    permissions:
      contents: read
    uses: ./.github/workflows/tindices_th.yml

