name: Update SN Tile Indices

on:
  workflow_call:
    outputs:
      artifact_name:
        description: "SN Tile Indices"
        value: ${{ jobs.build.outputs.artifact_name }}

permissions:
  contents: read

jobs:

  # DTM
  update-tindex-dtm-sn:
    uses: ./.github/workflows/tindex_creation.yml
    with:
      type: DTM
      state: SN
      script: SN_DGM_tileindex.py
      tindex_file: SN_DGM_tileindex_proj.gpkg.gz
  
  # DSM
  update-tindex-dsm-sn:
    uses: ./.github/workflows/tindex_creation.yml
    with:
      type: DSM
      state: SN
      script: SN_DOM_tileindex.py
      tindex_file: SN_DOM_tileindex_proj.gpkg.gz
  
  # DOP
  update-tindex-dop-sn:
    uses: ./.github/workflows/tindex_creation.yml
    with:
      type: DOP
      state: SN
      script: DOP_tileindex_SN.py
      tindex_file: DOP20_tileindex_SN.gpkg.gz
      python_libs: "selenium"
