name: Update BE/BB Tile Indices

on:
  workflow_call:
    outputs:
      artifact_name:
        description: "BE/BB Tile Indices"
        value: ${{ jobs.build.outputs.artifact_name }}

permissions:
  contents: read

jobs:

  # DTM
  update-tindex-dtm-bb:
    uses: ./.github/workflows/tindex_creation.yml
    with:
      type: DTM
      state: BB
      script: fetch_BB_DGM_list.sh
      tindex_file: BB_tileindex_dgm_proj.gpkg.gz
      alpine_packages: "bash lynx sed"

  update-tindex-dtm-be:
    uses: ./.github/workflows/tindex_creation.yml
    with:
      type: DTM
      state: BE
      script: BE_DTM_tindex.py
      tindex_file: be_dgm_tindex_proj.gpkg.gz
      alpine_packages: "gzip lynx sed"
  
  # DSM
  update-tindex-dsm-be:
    uses: ./.github/workflows/tindex_creation.yml
    with:
      type: DSM
      state: BE
      script: BE_DSM_tindex.py
      tindex_file: be_dom_tindex_proj.gpkg.gz
      alpine_packages: "gzip lynx sed"
      python_libs: "remotezip"
  
  # iDSM
  update-tindex-idsm-bb:
    uses: ./.github/workflows/tindex_creation.yml
    with:
      type: iDSM
      state: BB
      script: BB_iDSM_tindex.py
      tindex_file: BB_tileindex_dom_tif_proj.gpkg.gz
      alpine_packages: "sed"
  
  # DOP
  update-tindex-dop-be-bb:
    uses: ./.github/workflows/tindex_creation.yml
    with:
      type: DOP
      state: BE_BB
      script: DOP_tileindex_BE_BB.py
      tindex_file: DOP20_tileindex_BE_BB.gpkg.gz
      alpine_packages: "lynx sed py3-pandas py3-shapely python3-dev"
      python_libs: "geopandas pyogrio"
      # python_libs: requirements.txt
