name: Update all Tile Indices

on:
  push:
    # TODO main branch !!!
    branches: [ workflow_improvement ]
  schedule:
    # run tile index creation every month
    - cron:  '0 1 9 * *'

concurrency:
  group: commit-main
  cancel-in-progress: false

jobs:

  # NW
  update-tindex-ndsm-nw:
    runs-on: ubuntu-latest
    env:
      CI_COMMIT_MESSAGE: Update NW nDSM tile index
    steps:
    - uses: actions/checkout@v7
    - name: Creation of tindex
      run: |
        sed -i "s+# federal state specific required apk installations, to be replaced within workflow yaml+RUN apk add lynx+g" docker/Dockerfile
        sed -i "s+# federal state specific python script, to be replaced within workflow yaml+RUN grass -c epsg:25832 /grassdb/NW_nDSM --exec python3 nDSM/NW/openNRW_nDSM_tindex.py+g" docker/Dockerfile
        docker build -f docker/Dockerfile -t test-tindex .
        ID=$(docker create test-tindex)
        echo $ID
        docker cp $ID:/src/tile-indices/nDSM/NW/nrw_ndom_tindex_proj.gpkg.gz nDSM/NW/
    - name: Upload artifact A
      uses: actions/upload-artifact@v4
      with:
        name: nDSM-NW
        path: nDSM/NW/nrw_ndom_tindex_proj.gpkg.gz

  update-tindex-dop-nw:
    runs-on: ubuntu-latest
    env:
      CI_COMMIT_MESSAGE: Update NW DOP tile index
    steps:
    - uses: actions/checkout@v7
    - name: Creation of tindex
      run: |
        sed -i "s+# federal state specific required apk installations, to be replaced within workflow yaml+RUN apk add lynx parallel+g" docker/Dockerfile
        sed -i "s+# federal state specific python script, to be replaced within workflow yaml+RUN python3 DOP/NW/openNRW_DOP_tindex.py+g" docker/Dockerfile
        docker build -f docker/Dockerfile -t test-tindex .
        ID=$(docker create test-tindex)
        echo $ID
        docker cp $ID:/src/tile-indices/DOP/NW/openNRW_DOP10_tileindex.gpkg.gz DOP/NW/

  # commit all updated tile indices
  commit_changes:
    runs-on: ubuntu-latest
    needs: [update-tindex-ndsm-nw, job_b]
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Configure git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Commit and push with retry
        run: |
          set -e
          git fetch origin main
          git rebase origin/main || exit 1

          git add **/**/*.gpkg.gz
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "${{ env.CI_COMMIT_MESSAGE }}"
          if git push origin HEAD:main; then
            exit 0
          fi
